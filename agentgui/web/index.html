<!DOCTYPE html>
<!-- Adapted from LingChat; Copyright LingChat contributors; Apache-2.0. -->
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Chat</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%23e0845f'/%3E%3Cstop%20offset='1'%20stop-color='%23c4633f'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='32'%20height='32'%20rx='9'%20fill='url(%23g)'/%3E%3Cpath%20d='M16%2013.8V6.4M17.6%2014.4l3.9-3.9M18.2%2016h7.4M17.6%2017.6l3.9%203.9M16%2018.2v7.4M14.4%2017.6l-3.9%203.9M13.8%2016H6.4M14.4%2014.4l-3.9-3.9'%20fill='none'%20stroke='%23fff'%20stroke-width='2.9'%20stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/style.css" />
  <script>
    // Apply the stored theme and language before first paint: the theme to
    // avoid a flash, the language because <html lang> decides which CJK face the
    // font stacks fall through to.
    (() => {
      try {
        const t = localStorage.getItem("agentgui-theme");
        if (t === "light" || (t === null && matchMedia("(prefers-color-scheme: light)").matches)) {
          document.documentElement.dataset.theme = "light";
        }
        const l = localStorage.getItem("agentgui-lang");
        if (l === "zh" || l === "en") document.documentElement.lang = l;
      } catch { /* storage may be unavailable; the defaults are fine */ }
    })();
  </script>
</head>
<body>
  <div id="backdrop" hidden></div>

  <aside id="sidebar" data-i18n-aria-label="app.sessions" aria-label="会话">
    <div class="sidebar-head">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <defs>
            <linearGradient id="brand-g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#e0845f"/>
              <stop offset="1" stop-color="#c4633f"/>
            </linearGradient>
          </defs>
          <rect width="32" height="32" rx="9" fill="url(#brand-g)"/>
          <path d="M16.0 13.8L16.0 6.4M17.6 14.4L21.5 10.5M18.2 16.0L25.6 16.0M17.6 17.6L21.5 21.5M16.0 18.2L16.0 25.6M14.4 17.6L10.5 21.5M13.8 16.0L6.4 16.0M14.4 14.4L10.5 10.5"
                fill="none" stroke="#fff" stroke-width="2.9" stroke-linecap="round"/>
        </svg>
        <span class="brand-name">Agent<em>Chat</em></span>
      </div>
      <button id="sidebar-close" class="icon-btn" data-i18n-aria-label="app.close_sidebar"
              data-i18n-title="app.close_sidebar" aria-label="收起侧栏" title="收起侧栏">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>

    <button id="new-chat" class="new-chat-btn">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.2v9.6M3.2 8h9.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span data-i18n="app.new_chat">新对话</span>
    </button>

    <nav id="session-list" data-i18n-aria-label="app.stored_sessions" aria-label="已存对话"></nav>

    <div class="sidebar-foot">
      <button id="doctor-open" class="btn" data-i18n="app.doctor">安装检查</button>
      <button id="theme-toggle" class="theme-toggle" data-i18n-title="app.theme_toggle" title="切换主题">
        <svg class="theme-icon-dark" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M13.4 9.6A5.6 5.6 0 0 1 6.4 2.6a5.6 5.6 0 1 0 7 7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
        <svg class="theme-icon-light" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="3.1" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <path d="M8 1.2v1.9M8 12.9v1.9M1.2 8h1.9M12.9 8h1.9M3.2 3.2l1.3 1.3M11.5 11.5l1.3 1.3M12.8 3.2l-1.3 1.3M4.5 11.5l-1.3 1.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <span id="theme-label">主题</span>
      </button>
      <button id="lang-toggle" class="theme-toggle" data-i18n-title="app.lang_toggle" title="切换界面语言">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <path d="M1.8 8h12.4M8 1.8c1.7 1.7 2.6 3.9 2.6 6.2S9.7 12.5 8 14.2C6.3 12.5 5.4 10.3 5.4 8S6.3 3.5 8 1.8z"
                fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
        <span id="lang-label">English</span>
      </button>
    </div>
  </aside>

  <div id="chat">
    <header id="topbar">
      <button id="menu-btn" class="icon-btn" data-i18n-aria-label="app.open_sidebar"
              data-i18n-title="app.open_sidebar" aria-label="展开侧栏" title="展开侧栏">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <h1 id="chat-title" title="" data-i18n="app.new_chat">新对话</h1>
      <div class="topbar-meta">
        <button id="fork-chat" class="btn" hidden data-i18n="app.fork_chat">复刻对话</button>
        <span id="usage-chip" class="agent-chip" hidden></span>
        <span id="agent-chip" class="agent-chip" hidden></span>
        <span id="status-pill" class="status-pill" data-state="connecting">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status-text" data-i18n="conn.connecting">连接中</span>
        </span>
      </div>
    </header>

    <div id="conn-banner" hidden data-i18n="conn.lost">连接已断开 — 正在重连…</div>

    <main id="messages">
      <div id="thread" aria-live="polite"></div>
      <button id="jump-bottom" class="jump-bottom" hidden data-i18n-aria-label="composer.jump_latest" aria-label="回到最新消息">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v9.4M3.8 8.6L8 12.8l4.2-4.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </main>

    <form id="composer" autocomplete="off">
      <div class="composer-inner">
        <div id="attachment-tray" class="attachment-tray" hidden></div>
        <div class="input-shell">
          <button id="attach" class="icon-btn attach-btn" type="button" data-i18n-aria-label="composer.attach"
                  data-i18n-title="composer.attach" aria-label="添加附件" title="添加附件">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.2 8.5l4.6-4.6a2.3 2.3 0 0 1 3.3 3.3l-5.5 5.5a3.6 3.6 0 0 1-5.1-5.1l5.4-5.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <input id="file-input" type="file" multiple hidden />
          <textarea id="input" rows="1" data-i18n-placeholder="composer.placeholder"
                    data-i18n-aria-label="composer.message"
                    placeholder="给智能体发消息…" aria-label="消息"></textarea>
          <button id="send" type="submit" data-i18n-aria-label="composer.send_message"
                  data-i18n-title="composer.send" aria-label="发送消息" title="发送" disabled>
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.2 8L13.8 2.6 11 13.6l-3-3.8zM8 9.8l5.8-7.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          </button>
          <button id="stop" type="button" data-i18n-aria-label="composer.stop"
                  data-i18n-title="composer.stop" aria-label="停止回复" title="停止回复" hidden>
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4.6" y="4.6" width="6.8" height="6.8" rx="1.2" fill="currentColor"/></svg>
          </button>
        </div>
        <p class="composer-hint"><kbd>Enter</kbd> <span data-i18n="composer.hint_send">发送</span> · <kbd>Shift</kbd>+<kbd>Enter</kbd> <span data-i18n="composer.hint_newline">换行</span></p>
      </div>
    </form>
  </div>

  <!-- Inline shell-confirmation prompt, shown only when the agent asks. -->
  <div id="confirm" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="modal-card">
      <div class="modal-head">
        <span class="modal-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16"><path d="M3 4.5l3.5 3.5L3 11.5M8.5 11.5h4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <div>
          <div id="confirm-title" class="modal-title" data-i18n="approval.title">允许该操作？</div>
          <div class="modal-sub" data-i18n="approval.sub">智能体请求在工作区中执行以下操作。</div>
          <div id="confirm-runner" class="modal-runner"></div>
        </div>
      </div>
      <code id="confirm-cmd"></code>
      <div class="modal-actions">
        <button id="confirm-deny" class="btn"><span data-i18n="approval.deny">拒绝</span> <span class="key-hint">Esc</span></button>
        <button id="confirm-allow-session" class="btn btn-session" hidden data-i18n="approval.allow_session">本次会话均允许</button>
        <button id="confirm-allow" class="btn btn-primary" data-i18n="approval.allow_once">仅此一次</button>
      </div>
    </div>
  </div>

  <dialog id="new-chat-dialog" class="app-dialog">
    <form id="new-chat-form">
      <h2 data-i18n="app.new_chat">新对话</h2>
      <p data-i18n="newchat.intro">为这次对话选择智能体、工作区与权限级别。</p>
      <label for="new-model" data-i18n="newchat.model">模型</label>
      <div class="model-row">
        <span id="new-model-mark" class="model-mark" aria-hidden="true"></span>
        <select id="new-model" required></select>
      </div>
      <label for="new-workspace" data-i18n="newchat.workspace">工作区目录</label>
      <input id="new-workspace" list="recent-workspaces" required placeholder="/home/you/project" />
      <datalist id="recent-workspaces"></datalist>
      <label for="new-autonomy" data-i18n="newchat.autonomy">自主级别</label>
      <select id="new-autonomy"><option value="ask" data-i18n="newchat.autonomy_ask">写入前询问（默认）</option><option value="edit" data-i18n="newchat.autonomy_edit">可直接修改工作区</option></select>
      <p id="new-chat-error" role="alert"></p>
      <div class="modal-actions"><button type="button" id="new-chat-cancel" class="btn" data-i18n="app.cancel">取消</button><button id="new-chat-create" class="btn btn-primary" type="submit" data-i18n="newchat.create">创建对话</button></div>
    </form>
  </dialog>
  <dialog id="doctor-dialog" class="app-dialog"><h2 data-i18n="app.doctor">安装检查</h2><div id="doctor-results"></div><button id="doctor-close" class="btn" data-i18n="app.close">关闭</button></dialog>
  <script type="module" src="/js/main.js"></script>
</body>
</html>

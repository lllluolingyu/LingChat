[project]
name = "lingchat"
version = "0.2.0"
description = "Web UI front-end for LingCore agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["ai", "agents", "chat", "fastapi", "lingcore"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "lingcore>=0.2.0,<0.4.0",
    "fastapi==0.139.2",
    "uvicorn[standard]==0.51.0",
]

[project.scripts]
lingchat = "lingchat.__main__:main"

[project.urls]
Homepage = "https://github.com/lllluolingyu/LingChat"
Repository = "https://github.com/lllluolingyu/LingChat.git"
Issues = "https://github.com/lllluolingyu/LingChat/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lingchat"]

# The browser UI must ship inside the wheel (as lingchat/web/) or an installed
# LingChat cannot serve its own front-end; in a repo checkout the same files
# live at ./web (server.py checks both locations).
[tool.hatch.build.targets.wheel.force-include]
"web" = "lingchat/web"

# LingChat consumes the sibling lingcore package as an editable path dependency.
[tool.uv.sources]
lingcore = { path = "..", editable = true }

[dependency-groups]
dev = [
    "httpx2==2.7.0",
    "mypy==2.3.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["lingchat"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
disable_error_code = ["import-untyped"]
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

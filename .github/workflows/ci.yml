name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out LingCore 0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: lllluolingyu/LingCore
          ref: 8a598092c01f4c6f0b8211fcef07f545d3b28bbc # LingCore 0.2.0 release commit
          path: LingCore
      - name: Check out LingChat
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: LingCore/LingChat
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --python ${{ matrix.python-version }}
        working-directory: LingCore/LingChat
      - run: uv run --python ${{ matrix.python-version }} pytest -q
        working-directory: LingCore/LingChat
      - name: Check browser JavaScript syntax
        run: for file in web/js/*.js; do node --check "$file"; done
        working-directory: LingCore/LingChat

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - name: Check out LingCore 0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: lllluolingyu/LingCore
          ref: 8a598092c01f4c6f0b8211fcef07f545d3b28bbc # LingCore 0.2.0 release commit
          path: LingCore
      - name: Check out LingChat
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: LingCore/LingChat
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv build
        working-directory: LingCore/LingChat
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run python -c 'import os, tomllib; data = tomllib.load(open("pyproject.toml", "rb")); expected = "v" + data["project"]["version"]; actual = os.environ["RELEASE_TAG"]; assert actual == expected, f"tag {actual} does not match package {expected}"'
        working-directory: LingCore/LingChat
